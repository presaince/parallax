# The bug drop box. One file, uploaded by itself: the endpoint lives beside the APK on the app's
# own path, and the reports it writes go to a sibling directory the web server denies.
#
# Separate from any app build on purpose — this is server code, and it changes when the endpoint
# contract changes, not when the app ships.
account=opencode
remoteDir=other_apps/parallax
publicBase=https://odesaplay.com.ua/other_apps/parallax/
build=none
dist=server
allow=upload.php
