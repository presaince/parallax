# The direct build, uploaded from the project that builds it. The APK is signed with apksigner
# (see ROADMAP: AGP 9.4.1 does not apply the release signing config) and copied to
# app-release.apk, so the URL the portfolio's page links to never changes.
#
# No build on purpose: `npm run deploy` in a Gradle project is a lie, and the APK must be signed
# before it goes up.
account=opencode
remoteDir=other_apps/parallax
publicBase=https://odesaplay.com.ua/other_apps/parallax/
build=none
dist=app/build/outputs/apk/release
allow=app-release.apk,version.json
# The manifest goes up after the APK is verified: a client must never read a new versionCode
# while the old file is still what that URL serves. Generated by scripts/make-version-json.mjs
# after signing, so its sha256 describes the signed bytes.
defer=version.json
# No cache: this file changes every release and shares a remote directory with upload.php.
cache=none
