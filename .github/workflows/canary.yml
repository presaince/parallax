name: canary

# The extractor breaks when YouTube changes its markup, which is a weekly event. This job is the
# first thing that should go red, before a user notices a search that returns nothing.

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run the extractor canary
        run: >
          ./gradlew testDebugUnitTest
          --tests '*ExtractorCanaryTest*'
          -Dglasstube.canary=true
          --no-daemon --console=plain --rerun-tasks
