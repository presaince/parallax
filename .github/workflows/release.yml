name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PARALLAX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "PARALLAX_KEYSTORE_BASE64 is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/parallax.jks"

      - name: Build signed release
        env:
          PARALLAX_KEYSTORE: ${{ runner.temp }}/parallax.jks
          PARALLAX_KEYSTORE_PASSWORD: ${{ secrets.PARALLAX_KEYSTORE_PASSWORD }}
          PARALLAX_KEY_ALIAS: ${{ secrets.PARALLAX_KEY_ALIAS }}
          PARALLAX_KEY_PASSWORD: ${{ secrets.PARALLAX_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon --console=plain

      - name: Attach the APK to the tag
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
