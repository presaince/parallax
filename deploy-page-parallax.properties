# The retired download folder. The page moved to other_apps/glasstube/ with the
# rename; this uploads a redirect in its place so an old bookmark does not land on
# a page for a build nobody is offered. version.json is a tombstone: an installed
# Parallax reads code 12 and stops asking, instead of parsing the host's HTML stub
# and reporting a failed check. The old APK file stays where it is until the folder
# is deleted; nothing links to it.
account=opencode
remoteDir=other_apps/parallax
publicBase=https://odesaplay.com.ua/other_apps/parallax/
dist=none
build=none
extra=web/parallax-retired.html>index.html,web/parallax-version.json>version.json
defer=version.json
cache=none
