# The download page alone: web/index.html, uploaded to the same folder as the APK.
# Use this when only the copy changed. A release deploy (deploy-apk.properties)
# uploads the same file as part of the APK upload; this config exists so a page
# edit does not need a signed release sitting in app/build/outputs/apk/release.
account=opencode
remoteDir=other_apps/glasstube
publicBase=https://odesaplay.com.ua/other_apps/glasstube/
dist=none
build=none
extra=web/index.html>index.html,web/img/feed.webp>img/feed.webp,web/img/bored.webp>img/bored.webp,web/img/player.webp>img/player.webp,web/img/appearance.webp>img/appearance.webp,web/img/library.webp>img/library.webp,web/img/og.png>img/og.png,web/img/favicon.svg>img/favicon.svg
# The page changes when the copy does; a cached HTML would hide it.
cache=none
